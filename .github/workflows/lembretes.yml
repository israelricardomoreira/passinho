name: Lembretes do Passinho
on:
  schedule:
    - cron: '0 11 * * *'    # 08:00 em Brasília
    - cron: '30 15 * * *'   # 12:30 em Brasília
    - cron: '30 22 * * *'   # 19:30 em Brasília
  workflow_dispatch:
    inputs:
      turno:
        description: 'teste, manha, almoco ou noite'
        default: 'teste'
permissions:
  contents: write
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install web-push@3 --no-save --silent
      - run: node push/enviar.js
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          INSCRICAO: ${{ secrets.INSCRICAO }}
          TURNO: ${{ github.event.inputs.turno }}
      # O GitHub pausa agendamentos de repositórios sem movimento por 60 dias.
      # Uma vez por mês este passo registra um "estou vivo" para isso não acontecer.
      - name: Manter o agendamento ativo
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "11" ]; then
            date -u > push/ativo.txt
            git config user.name "passinho-bot"
            git config user.email "passinho-bot@users.noreply.github.com"
            git add push/ativo.txt && git commit -m "Lembretes: manter agendamento ativo" && git push
          fi
