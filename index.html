<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passinho</title>
<meta name="theme-color" content="#FBF7F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Passinho">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F0; --surface:#FFFFFF; --ink:#2A2320; --muted:#6B5F57; --line:#EADFD3; --soft:#F4ECE1;
  --primary:#8B3A62; --primary-ink:#FFFFFF; --primary-soft:#F6E7EE;
  --sun:#F4D35E; --sun-soft:#FBF1C9;
  --sleep:#4B4FA8; --sleep-soft:#E8E9F7;
  --food:#2E7D4F; --food-soft:#E3F2E8;
  --move:#B6452C; --move-soft:#FBE7E1;
  --gold:#B8862B; --coin:#C9961F;
  --r:18px;
  --shadow:0 1px 2px rgba(60,40,30,.06), 0 4px 14px rgba(60,40,30,.06);
  --font:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --pixel:'Silkscreen', ui-monospace, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.5}
body{min-height:100dvh; padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.ob{padding-bottom:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary); outline-offset:2px; border-radius:8px}
.wrap{max-width:560px; margin:0 auto; padding:0 16px}
h1,h2,h3{margin:0; line-height:1.2}
h1{font-size:1.6rem; font-weight:800}
h2{font-size:1.15rem; font-weight:800}
h3{font-size:1rem; font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.pix{font-family:var(--pixel); letter-spacing:.02em}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.center{text-align:center}

.top{position:sticky; top:0; z-index:5; background:rgba(251,247,240,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding-top:env(safe-area-inset-top)}
.top-in{display:flex; align-items:center; gap:12px; padding:10px 0}
.bust{width:48px; height:48px; border-radius:50%; background:var(--sun-soft); border:2px solid var(--sun); overflow:hidden; flex:none; display:grid; place-items:center}
.bust canvas{image-rendering:pixelated; width:48px; height:48px}
.hello{flex:1; min-width:0}
.hello b{display:block; font-size:1.1rem; font-weight:800}
.hello span{font-size:.85rem; color:var(--muted)}
.icon-btn{width:44px; height:44px; border-radius:50%; border:0; background:transparent; display:grid; place-items:center; color:var(--ink); flex:none}
.icon-btn:active{background:var(--soft)}
svg.i{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}
.stats{display:flex; gap:8px; padding:0 0 10px}
.stat{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-weight:800; font-size:.9rem; min-height:36px}
.stat svg.i{width:18px; height:18px}
.stat.coin{color:#7A5A0E; background:#FFF6D8; border-color:#F0DC9A}
button.stat{cursor:pointer}

.card{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; margin:12px 0}
.card-h{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
.sec-t{display:flex; align-items:baseline; justify-content:space-between; margin:20px 2px 4px}
.sec-t p{font-size:.85rem; color:var(--muted)}

.btn{min-height:48px; border-radius:14px; border:0; padding:0 18px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--primary); color:var(--primary-ink)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--soft); color:var(--ink)}
.btn.line{background:transparent; border:1.5px solid var(--line); color:var(--ink)}
.btn.sun{background:var(--sun); color:#3a2c00}
.btn.full{width:100%}
.btn.danger{background:#FCE8E6; color:#9B2C1F}
.btn[disabled]{opacity:.5}
.link{background:none; border:0; color:var(--primary); font-weight:800; padding:10px 6px; min-height:44px}
.row{display:flex; gap:8px; align-items:center}
.grow{flex:1; min-width:0}

.mission{display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:12px 12px 12px 14px; margin:10px 0; border-left:5px solid var(--c)}
.mission .ico{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--cs); color:var(--c); flex:none}
.mission .txt{flex:1; min-width:0}
.mission .lbl{font-size:.75rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--c)}
.mission .t{font-weight:700}
.mission .swap{background:none; border:0; color:var(--muted); font-size:.82rem; font-weight:700; padding:4px 0; min-height:32px; display:inline-flex; gap:4px; align-items:center}
.mission .swap svg.i{width:15px; height:15px}
.check{width:48px; height:48px; border-radius:50%; border:2.5px solid var(--c); background:var(--surface); color:var(--c); display:grid; place-items:center; flex:none}
.check svg.i{opacity:0; width:26px; height:26px; stroke-width:3}
.check.on{background:var(--c); color:#fff}
.check.on svg.i{opacity:1}
.mission.done{background:linear-gradient(90deg, var(--cs), var(--surface) 70%)}
.p-sono{--c:var(--sleep); --cs:var(--sleep-soft)}
.p-comida{--c:var(--food); --cs:var(--food-soft)}
.p-mov{--c:var(--move); --cs:var(--move-soft)}
.p-bonus{--c:var(--primary); --cs:var(--primary-soft)}
.counter{display:flex; align-items:center; gap:4px}
.counter button{width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); display:grid; place-items:center}
.counter b{min-width:44px; text-align:center}
.tag{display:inline-block; font-size:.72rem; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--primary-soft); color:var(--primary)}
.tag.ok{background:var(--food-soft); color:var(--food)}
.tag.off{background:var(--soft); color:var(--muted)}
.tag.coin{background:#FFF6D8; color:#7A5A0E}

.sleep-card{background:linear-gradient(160deg, #2E3170, #4B4FA8); color:#fff}
.sleep-card .muted{color:#D9DAF5}
.sleep-card select{background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff}
.sleep-card select option{color:#222}
.sel{appearance:none; -webkit-appearance:none; min-height:48px; border-radius:12px; padding:0 14px; font-weight:800; font-size:1.05rem; width:100%}
.q-row{display:flex; gap:8px; margin-top:12px}
.q-row button{flex:1; min-height:44px; border-radius:12px; border:1.5px solid rgba(255,255,255,.35); background:transparent; color:#fff; font-weight:700}
.q-row button.on{background:#fff; color:#2E3170; border-color:#fff}
.bars{display:flex; gap:8px; align-items:flex-end; height:120px; margin-top:8px}
.bar{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; border:0; background:none; padding:0}
.bar i{display:block; width:100%; border-radius:8px 8px 4px 4px; background:var(--sleep); min-height:4px}
.bar i.empty{background:var(--soft)}
.bar small{font-size:.72rem; color:var(--muted); font-weight:700}
.bar em{font-style:normal; font-size:.72rem; font-weight:800}

.prog{height:14px; border-radius:999px; background:var(--soft); overflow:hidden}
.prog i{display:block; height:100%; background:repeating-linear-gradient(90deg, var(--sun) 0 10px, #EAC23E 10px 12px); border-radius:999px; transition:width .5s}
.prog.food i{background:var(--food)}
.prog.over i{background:#D98A3D}
.prog.thin{height:8px}
.mimo{background:linear-gradient(160deg, var(--sun-soft), #fff)}
.mimo.won{background:linear-gradient(160deg, #FFE9A8, #FFF8E0); border:2px dashed var(--gold)}

.box-cta{display:flex; align-items:center; gap:14px}
.box-cta canvas{image-rendering:pixelated; width:56px; height:56px; flex:none}
.reveal{text-align:center; padding:8px 0}
.reveal canvas{image-rendering:pixelated}
.quote{font-size:1.1rem; font-weight:700; line-height:1.5; margin:12px 0}
.sign{color:var(--primary); font-weight:800}

.room{border-radius:var(--r); overflow:hidden; background:#E9DCCB; line-height:0}
.room canvas{width:100%; image-rendering:pixelated; display:block}
.cozy{font-size:.85rem; color:var(--food); font-weight:700; margin-top:8px; display:flex; gap:6px; align-items:flex-start}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
.chip{min-height:40px; border-radius:999px; padding:0 14px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; font-size:.92rem; white-space:nowrap}
.chip.on{background:var(--primary); border-color:var(--primary); color:#fff}
.swatch{width:44px; height:44px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1.5px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--primary)}
.list{list-style:none; margin:0; padding:0}
.list li{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.coll{border-left:4px solid var(--sun); padding:8px 12px; margin:8px 0; background:var(--soft); border-radius:0 12px 12px 0}
.coll.cat{border-color:var(--primary)}

.daynav{display:flex; align-items:center; justify-content:space-between; margin:8px 0}
.slot-h{display:flex; align-items:center; justify-content:space-between; gap:8px}
.food-item{display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line)}
.food-item .q{font-weight:800; color:var(--food); white-space:nowrap}
.add-row{display:flex; align-items:center; gap:6px; color:var(--food); font-weight:800; background:none; border:0; min-height:44px; padding:0}
.roles{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.kpi{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.kpi div{background:var(--soft); border-radius:12px; padding:8px 10px}
.kpi b{display:block; font-size:1.05rem}
.food-pick{display:flex; align-items:center; gap:10px; width:100%; min-height:52px; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; padding:6px 2px}
.food-pick.on{background:var(--food-soft)}
.food-pick small{display:block; color:var(--muted); font-size:.8rem}
.gdot{width:10px; height:10px; border-radius:50%; flex:none}

label.f{display:block; margin:12px 0 4px; font-weight:700; font-size:.9rem}
.in{width:100%; min-height:48px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); padding:0 14px; font-size:16px}
.in:focus{border-color:var(--primary); outline:none}
.help{font-size:.82rem; color:var(--muted); margin-top:4px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:6px; align-items:end}
.stepper{display:flex; align-items:center; gap:6px}
.stepper .in{text-align:center; font-weight:800}
.opt{display:grid; gap:8px}
.opt button{min-height:52px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); text-align:left; padding:8px 14px; font-weight:700}
.opt button small{display:block; color:var(--muted); font-weight:500}
.opt button.on{border-color:var(--primary); background:var(--primary-soft)}

.sheet-bg{position:fixed; inset:0; background:rgba(30,20,15,.4); z-index:20; display:none}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--bg); border-radius:22px 22px 0 0; max-height:92dvh; overflow:auto; padding:8px 16px calc(20px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .25s ease; max-width:560px; margin:0 auto; overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet-bg.open{display:block}
.grab{width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 10px}
.sheet-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}

nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:10; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{display:flex; max-width:560px; margin:0 auto}
.tab{flex:1; min-height:60px; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--muted); font-size:.72rem; font-weight:800; position:relative}
.tab.on{color:var(--primary)}
.tab.on::before{content:''; position:absolute; top:0; left:30%; right:30%; height:3px; border-radius:0 0 3px 3px; background:var(--primary)}
.tab .dot{position:absolute; top:8px; right:calc(50% - 18px); width:9px; height:9px; border-radius:50%; background:var(--move); border:2px solid #fff}

.toast{position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top)); transform:translateX(-50%) translateY(-20px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; font-weight:700; opacity:0; transition:.25s; z-index:30; max-width:90vw; text-align:center; pointer-events:none}
.toast.show{opacity:1; transform:translateX(-50%)}
.confetti{position:fixed; width:8px; height:8px; z-index:40; pointer-events:none; animation:fall 1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx), var(--dy)) rotate(260deg); opacity:0}}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

.ob-wrap{min-height:100dvh; display:flex; flex-direction:column; padding-top:calc(16px + env(safe-area-inset-top)); padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.ob-steps{display:flex; gap:6px; margin-bottom:18px}
.ob-steps i{flex:1; height:5px; border-radius:3px; background:var(--line)}
.ob-steps i.on{background:var(--primary)}
.ob-body{flex:1}
.ob-foot{display:flex; gap:8px; margin-top:20px}
.avatar-big{display:grid; place-items:center; background:linear-gradient(180deg, var(--sun-soft), #fff); border-radius:var(--r); padding:12px; margin:8px 0}
.avatar-big canvas{image-rendering:pixelated}
.welcome-bust{width:120px; height:120px; margin:24px auto 16px; border-width:3px}
.welcome-bust canvas{width:120px; height:120px}

.wardrobe-items{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.witem{border:1.5px solid var(--line); background:var(--surface); border-radius:14px; padding:10px; text-align:left; min-height:64px; display:flex; gap:10px; align-items:center}
.witem.on{border-color:var(--primary); background:var(--primary-soft)}
.witem.try{border-color:var(--sun); background:var(--sun-soft)}
.witem i{width:26px; height:26px; border-radius:8px; flex:none; border:1px solid rgba(0,0,0,.12)}
.witem b{display:block; font-size:.88rem; line-height:1.25}
.witem small{font-size:.76rem; color:var(--muted); font-weight:700}
.buybar{position:sticky; bottom:calc(-20px - env(safe-area-inset-bottom)); background:var(--bg); padding:10px 0 4px; margin-top:8px}

.chart{width:100%; height:auto}
.chart text{font-size:10px; fill:var(--muted); font-family:var(--font); font-weight:700}
.empty{color:var(--muted); text-align:center; padding:12px 0}
.ex-row{border-top:1px solid var(--line); padding:10px 0}
.ex-row:first-child{border-top:0}
.trend-up{color:var(--food); font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" aria-label="Seções"></nav>
<div class="sheet-bg" id="sheetBg" data-a="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">

<script>

const foodById = id => F[id];
function portionUnit(f){ const m = norm(f.p || '').match(/^1\s+([a-zçãéí ]+?)(\s*\(|$)/); if (!m) return null; const w = m[1].trim(); const u = Object.keys(MEDIDA_G).find(x => norm(x) === w || (w === 'media' && x === 'unidade') || (w === 'col. de sopa' && x === 'colher de sopa')); return u || null; }
function gramsPer(f, u){
  if (f.uw && f.uw[u]) return f.uw[u];
  if (u === 'porção') return f.gr;
  if (u === 'g' || u === 'ml') return 1;
  if (u === 'kg') return 1000;
  if (portionUnit(f) === u && f.gr) return f.gr;
  return MEDIDA_G[u] || null;
}
function kcalOf(f, q, u){
  if (!f) return null;
  if (u === 'porção') return f.k * q;
  if (portionUnit(f) === u && !(f.uw && f.uw[u])) return f.k * q;
  const g = gramsPer(f, u);

}

function roles(f){
  const r = [];
  if (['prot','leite','leg'].indexOf(f.g) >= 0 || f.pr >= 8) r.push('prot');
  if (['veg','fruta','leg'].indexOf(f.g) >= 0 || (f.fb || 0) >= 2.5) r.push('fibra');

  if (f.g === 'prato'){ r.push('prot'); r.push('fibra'); r.push('carbo'); }

}
function slotRoles(d, sid){ const set = {}; ((d && d.food) || []).filter(x => x.s === sid).forEach(x => { const f = foodById(x.f); if (f) roles(f).forEach(r => set[r] = 1); }); return set; }

function latestOf(key){ const m = S.measures.slice().sort((a, b) => a.d < b.d ? -1 : 1); for (let i = m.length - 1; i >= 0; i--) if (m[i][key] != null) return m[i][key]; return null; }

  if (id === 'caminhar') return exMin(d, 'caminhada') >= 10;
  if (id === 'alongar') return exMin(d, 'alongamento') >= 2;
  if (id === 'dancar') return exMin(d, 'danca') >= 3;

function settle(){

    if (verdeDay(k)) earn('verde:' + k, GANHO.verde, 'dia com fruta e verdura');

  });

  if (gymCount() >= 1) give('tenis');

function lineChart(pts, unit){
  if (pts.length < 2) return `<p class="small muted" style="margin-top:12px">${pts.length ? 'Última: <b>' + nf1.format(pts[0].v) + ' ' + unit + '</b>. Com duas medições aparece o gráfico.' : ''}</p>`;
  const W = 320, H = 150, pl = 34, pr = 10, pt = 16, pb = 22;
  const vs = pts.map(p => p.v); let mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs); if (mx - mn < 1){ mn -= .5; mx += .5; }
  const X = i => pl + i * (W - pl - pr) / (pts.length - 1), Y = v => pt + (mx - v) * (H - pt - pb) / (mx - mn);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const diff = vs[vs.length - 1] - vs[0];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução de ${nf1.format(vs[0])} para ${nf1.format(vs[vs.length - 1])} ${unit}">
    <line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="#EADFD3"/>
    <text x="2" y="${Y(mx) + 4}">${nf1.format(mx)}</text><text x="2" y="${Y(mn) + 4}">${nf1.format(mn)}</text>
    <path d="${line}" fill="none" stroke="#8B3A62" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.5" fill="#fff" stroke="#8B3A62" stroke-width="2"/>`).join('')}
    <text x="${pl}" y="${H - 6}">${fmtD(pts[0].d)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${fmtD(pts[pts.length - 1].d)}</text>
  </svg><p class="small" style="margin-top:4px">Desde a primeira: <b>${diff > 0 ? '+' : ''}${nf1.format(diff)} ${unit}</b></p>`;
}

function exportData(){
  S.lastBackup = today(); save();
  const txt = JSON.stringify(S), name = 'passinho-backup-' + today() + '.json', blob = new Blob([txt], {type:'application/json'});
  try { const file = new File([blob], name, {type:'application/json'}); if (navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file], title:'Backup do Passinho'}).catch(() => {}); return; } } catch(e){}
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !d.days || !d.v) throw 0; S = d; migrate(); rebuildFoods(); save(); closeSheet(); render(); toast('Backup restaurado'); } catch(err){ toast('Esse arquivo não é um backup do Passinho'); } e.target.value = ''; };
  r.readAsText(f);
});

function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#F4D35E','#8B3A62','#4B4FA8','#2E7D4F','#E8A0A8'];
  for (let i = 0; i < 24; i++){
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = (window.innerWidth / 2) + 'px'; c.style.top = (window.innerHeight / 2) + 'px'; c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', (Math.random() * 300 - 150) + 'px'); c.style.setProperty('--dy', (Math.random() * 300 - 200) + 'px');
    document.body.appendChild(c); setTimeout(() => c.remove(), 1100);
  }
}

/* ===================================================================== eventos */
let resetArm = false, exT = 'caminhada', exM = 10;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, t = today();
  switch (a){
    // cadastro
    case 'obNext': obRead();
      if (ob.step === 0 && !ob.data.name){ toast('Escreva seu nome'); $('#obName').focus(); return; }
      if (ob.step === 1){ const d = ob.data; if (!num(d.idade) || !num(d.altura) || !num(d.peso)){ toast('Preencha idade, altura e peso'); return; } if (num(d.altura) < 120 || num(d.altura) > 220){ toast('A altura é em centímetros, ex.: 160'); return; } }
      ob.step++; render(); window.scrollTo(0, 0); break;
    case 'obBack': obRead(); ob.step = Math.max(0, ob.step - 1); render(); break;
    case 'obAtiv': obRead(); ob.data.ativ = Number(b.dataset.v); render(); break;
    case 'obRitmo': obRead(); ob.data.ritmo = Number(b.dataset.v); render(); break;
    case 'obFinish': obFinish(); break;
    case 'look': {
      const k = b.dataset.k, v = b.dataset.v;
      if (b.dataset.ctx === 'ob'){ ob.data.look[k] = v; render(); }
      else { S.look[k] = v; save(); $('#sheet')._st = $('#sheet').scrollTop; openWardrobe(); drawBust($('#bustT')); }
      break; }
    case 'wearNecklace': S.wear.acc.colar_ana = true; save(); closeSheet(); render(); toast('Ficou lindo!'); break;
    // geral
    case 'tab': tab = b.dataset.t; if (tab === 'comida') foodDay = today(); closeSheet(); render(); window.scrollTo(0, 0); break;
    case 'settings': openSettings(); break;
    case 'closeSheet': closeSheet(); if (tab === 'quarto') render(); break;
    case 'toggle': {
      const id = b.dataset.m, d = getDay(t, true);
      if (id === 'sono_reg'){ if (!S.sleep[t]){ toast('Anote o sono no cartão de cima'); window.scrollTo({top:0, behavior:'smooth'}); } else toast('Já anotado. Para mudar, toque em editar.'); return; }
      const was = isDone(t, id);
      if (id === 'agua') d.agua = was ? Math.max(0, S.agua - 1) : S.agua;
      else if (id === 'academia'){ d.gym = !d.gym; d.m.academia = d.gym; }
      else if (was && !d.m[id]){ toast('Essa marcou sozinha pelo que você anotou'); return; }
      else d.m[id] = !d.m[id];
      afterChange(); if (!was) confetti();
      break; }
    case 'agua': { const k = b.dataset.k || t, d = getDay(k, true); d.agua = Math.max(0, (d.agua || 0) + Number(b.dataset.d)); afterChange(); break; }
    case 'swap': openSwap(b.dataset.p); break;
    case 'pick': S.pick[b.dataset.p] = b.dataset.m; save(); closeSheet(); render(); break;
    case 'sleepQ': sleepQ = Number(b.dataset.q); b.parentElement.querySelectorAll('button').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); }); break;
    case 'saveSleep': { const k = b.dataset.k, bt = $('#slB').value, wt = $('#slW').value, first = !S.sleep[k]; S.sleep[k] = {b:bt, w:wt, h:sleepHours(bt, wt), q:sleepQ}; closeSheet(); afterChange(); if (first && k === t) confetti(); else if (!first) toast('Sono salvo'); break; }
    case 'editSleep': openSleep(b.dataset.k); break;
    case 'delSleep': delete S.sleep[b.dataset.k]; closeSheet(); afterChange(); break;
    case 'openBox': openBox(); break;
    case 'reReveal': { const d = S.days[t]; if (d && d.box) showReveal(d.box); break; }
    case 'goRoom': closeSheet(); tab = 'quarto'; render(); window.scrollTo(0, 0); break;
    case 'mimo': openMimo(b.dataset.ym); break;
    case 'mimoPick': S.mimos[b.dataset.ym].escolha = MIMOS[Number(b.dataset.i)]; save(); render(); openMimo(b.dataset.ym); break;
    case 'mimoTroca': S.mimos[b.dataset.ym].escolha = null; save(); render(); openMimo(b.dataset.ym); break;
    case 'mimoOk': S.mimos[b.dataset.ym].entregue = true; save(); render(); openMimo(b.dataset.ym); confetti(); break;
    case 'coll': collTab = b.dataset.c; render(); break;
    case 'itemsList': openItems(); break;
    case 'code': openCode(); break;
    case 'redeem': {
      const raw = ($('#cdIn').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      const h = String(hash('passinho:' + raw)), val = CODIGOS[h];
      if (!raw){ toast('Digite o código'); return; }
      if (!val){ toast('Código não encontrado. Confere as letras?'); return; }
      if (S.codes[h]){ toast('Esse código já foi usado'); return; }
      S.codes[h] = t; closeSheet(); earn('code:' + h, val, 'código do ' + QUEM_DA_O_MIMO); afterChange(); confetti(); break; }
    // guarda-roupa
    case 'wardrobe': tryOn = null; openWardrobe(); break;
    case 'wCat': wCat = b.dataset.c; tryOn = null; $('#sheet')._st = 0; openWardrobe(); break;
    case 'wItem': { const id = b.dataset.id; $('#sheet')._st = $('#sheet').scrollTop;
      if (S.owned[id]){ S.wear = wearWith(S.wear, id); tryOn = null; save(); drawBust($('#bustT')); }
      else tryOn = tryOn === id ? null : id;
      openWardrobe(); break; }
    case 'buy': { const r = roupa(b.dataset.id); if (!r || S.owned[r.id] || S.coins < r.preco) return; S.coins -= r.preco; S.owned[r.id] = 1; S.wear = wearWith(S.wear, r.id); tryOn = null; save(); openWardrobe(); drawBust($('#bustT')); confetti(); toast('Comprado e vestido!'); break; }
    case 'buyRoom': { const it = LOJA_QUARTO.find(x => x[0] === b.dataset.id); if (!it || S.room.items[it[0]]) return; if (S.coins < it[2]){ toast('Faltam ' + (it[2] - S.coins) + ' moedas'); return; } S.coins -= it[2]; S.room.items[it[0]] = t; save(); openWardrobe(); confetti(); toast(it[1] + ' no seu quarto!'); break; }
    // comida
    case 'fday': { const k = addDays(foodDay || t, Number(b.dataset.d)); if (k > t) return; foodDay = k; render(); break; }
    case 'addFood': openAddFood(b.dataset.k, b.dataset.s); break;
    case 'pickFood': { const f = F[b.dataset.id]; addCtx.f = f.id; const pu = portionUnit(f); addCtx.u = pu || 'porção'; addCtx.q = 1; renderAddFood(); break; }
    case 'fq': { const v = Math.max(0.5, (num($('#fq').value) || 0) + Number(b.dataset.d)); $('#fq').value = nf2.format(v); $('#fq').dispatchEvent(new Event('input')); break; }
    case 'saveFood': saveFood(); break;
    case 'adjUnit': addCtx.q = num($('#fq').value) || addCtx.q; openAdjUnit(); break;
    case 'saveAdj': { const g = num($('#adjG').value); if (!g || g <= 0){ toast('Coloque os gramas'); return; } const f = F[addCtx.f];
      if (f.custom){ const c = S.customFoods.find(x => x.id === f.id); c.uw = Object.assign({}, c.uw, {[addCtx.u]:g}); }
      else { S.foodEdits[f.id] = S.foodEdits[f.id] || {uw:{}}; S.foodEdits[f.id].uw[addCtx.u] = g; }
      rebuildFoods(); save(); renderAddFood(); toast('Medida ajustada'); break; }
    case 'clearAdj': delete S.foodEdits[b.dataset.id]; rebuildFoods(); save(); openFoodLib(); break;
    case 'delFood': { const d = S.days[b.dataset.k]; d.food = d.food.filter(x => x.id !== b.dataset.id); afterChange(); break; }
    case 'foodLib': openFoodLib(); break;
    case 'newFood': { const back = addCtx && $('#foodSearch') ? addCtx : null; newFoodBack = back; openNewFood(b.dataset.name || ''); break; }
    case 'editCustom': newFoodBack = null; openNewFood('', b.dataset.id); break;
    case 'saveNewFood': {
      const n = $('#nfN').value.trim(), gr = num($('#nfP').value), k = num($('#nfK').value);
      if (!n){ toast('Coloque o nome'); return; } if (!gr || gr <= 0){ toast('Coloque a porção em gramas'); return; } if (k == null || k < 0){ toast('Coloque as calorias'); return; }
      const id = b.dataset.id || 'c_' + uid();
      const data = {id, n, g:$('#nfG').value, gr, k, pr:num($('#nfPr').value) || 0, fb:num($('#nfFb').value) || 0, p:'porção de ' + nf2.format(gr) + ' g'};
      const i = S.customFoods.findIndex(x => x.id === id);
      if (i >= 0) S.customFoods[i] = Object.assign(S.customFoods[i], data); else S.customFoods.push(Object.assign({uw:{}}, data));
      rebuildFoods(); save(); toast('Alimento salvo');
      if (newFoodBack){ addCtx = newFoodBack; addCtx.f = id; addCtx.u = 'porção'; addCtx.q = 1; addCtx.search = n; newFoodBack = null; renderAddFood(); } else openFoodLib();
      break; }
    case 'delCustom': { const used = Object.values(S.days).some(d => (d.food || []).some(x => x.f === b.dataset.id)); if (used){ toast('Já foi usado. Edite em vez de excluir.'); return; } S.customFoods = S.customFoods.filter(f => f.id !== b.dataset.id); rebuildFoods(); save(); openFoodLib(); break; }
    // treino
    case 'addEx': exT = 'caminhada'; exM = 10; openAddEx(); break;
    case 'exT': exT = b.dataset.t; $$('#exT .chip').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'exM': exM = Number(b.dataset.m); $$('#exM .chip').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'saveEx': { getDay(t, true).ex.push({t:exT, min:exM}); closeSheet(); if (!afterChange()) toast('Anotado'); break; }
    case 'delEx': S.days[t].ex.splice(Number(b.dataset.i), 1); afterChange(); break;
    case 'editFicha': openFicha(b.dataset.id); break;
    case 'fichaAddEx': readFicha(); fichaDraft.ex.push({id:uid(), n:'', s:3, r:'12', c:null}); renderFicha(); break;
    case 'fichaDelEx': readFicha(); fichaDraft.ex = fichaDraft.ex.filter(e => e.id !== b.dataset.id); renderFicha(); break;
    case 'saveFicha': { readFicha(); const f = fichaDraft; delete f._existing; f.ex = f.ex.filter(e => e.n.trim()); const i = S.fichas.findIndex(x => x.id === f.id); if (i >= 0) S.fichas[i] = f; else S.fichas.push(f); save(); closeSheet(); render(); toast('Ficha salva'); break; }
    case 'delFicha': S.fichas = S.fichas.filter(x => x.id !== fichaDraft.id); save(); closeSheet(); render(); break;
    case 'startSession': openSession(b.dataset.id); break;
    case 'sessDone': { readSession(); const e = sessDraft.ex[Number(b.dataset.i)]; e.done = !e.done; b.classList.toggle('on', e.done); b.setAttribute('aria-pressed', e.done); break; }
    case 'finishSession': { readSession(); if (!sessDraft.ex.some(e => e.done)){ toast('Marque pelo menos um exercício'); return; }
      S.sessions.push(sessDraft); const d = getDay(t, true); d.gym = true; d.m.academia = true;
      const f = S.fichas.find(x => x.id === sessDraft.fid); if (f) sessDraft.ex.forEach(e => { const fe = f.ex.find(x => x.n === e.n); if (fe && e.done && e.c != null) fe.c = e.c; });
      sessDraft = null; closeSheet(); confetti(); if (!afterChange()) toast('Treino salvo!'); break; }
    // corpo
    case 'metric': corpoMetric = b.dataset.m; render(); break;
    case 'addMeasure': openMeasure(b.dataset.id); break;
    case 'saveMeasure': { const id = b.dataset.id, x = id ? S.measures.find(m => m.id === id) : {id:uid()}; x.d = $('#mD').value || t; let any = false;
      MEDIDAS.forEach(m => { const v = num($('#m_' + m[0]).value); x[m[0]] = v; if (v != null) any = true; });
      if (!any){ toast('Preencha pelo menos uma medida'); return; }
      if (!id) S.measures.push(x); save(); closeSheet(); render(); toast('Medidas salvas'); break; }
    case 'delMeasure': S.measures = S.measures.filter(m => m.id !== b.dataset.id); save(); closeSheet(); render(); break;
    case 'editProfile': openProfile(); break;
    case 'pfAtiv': profDraft.ativ = Number(b.dataset.v); $$('#pfAtiv button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'pfRitmo': profDraft.ritmo = Number(b.dataset.v); $$('#pfRitmo button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'saveProfile': { const p = S.profile; p.idade = num($('#pfI').value) || p.idade; p.altura = num($('#pfA').value) || p.altura; p.ativ = profDraft.ativ; p.ritmo = profDraft.ritmo; p.kcalManual = num($('#pfK').value) || null; save(); closeSheet(); render(); toast('Perfil salvo'); break; }
    // ajustes
    case 'saveSettings': { const n = $('#stN').value.trim(), ag = parseInt($('#stA').value, 10); if (n) S.name = n; if (ag > 0 && ag < 30) S.agua = ag; closeSheet(); afterChange(); toast('Salvo'); break; }
    case 'export': exportData(); break;
    case 'import': $('#fileIn').click(); break;
    case 'reset': if (!resetArm){ resetArm = true; b.textContent = 'Toque de novo para confirmar'; setTimeout(() => { resetArm = false; }, 4000); return; }
      S = defaultState(); ob = {step:0, data:null}; rebuildFoods(); save(); closeSheet(); tab = 'hoje'; render(); break;
  }
});
let newFoodBack = null;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && e.target.id === 'obName'){ const b = document.querySelector('[data-a="obNext"]'); if (b) b.click(); } if (e.key === 'Enter' && e.target.id === 'cdIn'){ const b = document.querySelector('[data-a="redeem"]'); if (b) b.click(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && S.onboarded){ settle(); save(); render(); flushCoins(); } });
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { const cv = $('#roomCv'); if (cv){ cv._k = 0; drawRoom(cv, frame); } }, 200); });

/* ===================================================================== início */
load(); rebuildFoods();
if (S.onboarded){ settle(); pendingCoins.length = 0; save(); }
if (!localStorage.getItem(KEY)) idbLoad().then(txt => { if (txt){ try { S = JSON.parse(txt); migrate(); rebuildFoods(); save(); render(); } catch(e){} } });
render();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__passinho = {get S(){ return S; }, render, settle, afterChange, F:() => F, kcalOf, gramsPer, drawFull, drawNecklace};
})();
</script>
</body>
